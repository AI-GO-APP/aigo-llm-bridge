name: release

# main 上的 VERSION 是新的版本號時,自動打 tag vX.Y.Z 並建立 GitHub Release。
# Release 附上使用者會單獨下載的檔案,讓 docs/04 與 README 的
# releases/latest/download/<檔名> 網址永遠指向最新版。

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 版本號一致、範例與正本一致
        run: |
          python tools/version.py --check
          python tools/sync_clients.py --check
      - name: 建立 tag 與 Release(已存在就略過)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(head -n1 VERSION | tr -d '\r ')
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag 已存在,略過"
            exit 0
          fi
          python tools/version.py --notes > notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          # 檔名在各資料夾間不重複,直接以原檔名附上
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md $prerelease \
            worker/aigo_bridge_worker.py \
            worker/autostart/install-windows-task.ps1 \
            worker/autostart/com.aigo.llm-bridge-worker.plist \
            worker/autostart/aigo-llm-bridge-worker.service \
            clients/browser/bridge.ts \
            clients/custom-app/bridge_block.py \
            clients/python/aigo_bridge.py
