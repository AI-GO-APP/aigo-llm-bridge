name: Desktop macos
on:
  pull_request:
    paths: ['desktop/**', 'desktop_bridge/**', 'tools/install.py', 'tools/mac_service.py', 'tools/verify_macos_console.py', 'tools/verify_macos_package.py', 'desktop_platform/macos/**', 'packaging/build_desktop.py', 'packaging/macos/**', '.github/workflows/desktop-macos.yml', 'VERSION']
  push:
    branches: [main]
    paths: ['desktop/**', 'desktop_bridge/**', 'tools/install.py', 'tools/mac_service.py', 'tools/verify_macos_console.py', 'tools/verify_macos_package.py', 'desktop_platform/macos/**', 'packaging/build_desktop.py', 'packaging/macos/**', '.github/workflows/desktop-macos.yml', 'VERSION']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  byo-source:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop_bridge/requirements-macos.txt pytest
      - run: python -m pytest desktop_bridge/tests -q
      - run: python tools/check_product_docs.py
      - run: python tools/verify_macos_console.py --output "${{ runner.temp }}/mac-console"
      - run: python packaging/macos/build.py
      - name: Install current BYO release ZIP and verify real service
        run: python tools/verify_macos_package.py --package dist/macos-source/aigo-llm-bridge-macos-source-$(cat VERSION).zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-byo-source
          path: dist/macos-source/*

  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: 共用核心與本平台回歸
        run: python -m pytest desktop/tests desktop_platform/macos/tests worker/tests -q
      - name: 原生安裝與設定煙霧測試
        env:
          AIGO_DESKTOP_HOME: ${{ runner.temp }}/aigo-desktop-smoke
        run: python desktop_platform/macos/install.py --no-start --port 18790
      - name: 建置本平台安裝包
        run: python packaging/build_desktop.py --target macos --output dist/macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macos
          path: dist/macos/*
