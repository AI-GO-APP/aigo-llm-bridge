name: Relay batch research
on:
  pull_request:
    paths: ['spikes/relay-batch/**', 'cloudflare/src/worker.js', 'cloudflare/test/relay.test.js', '.github/workflows/relay-batch-research.yml']
  push:
    branches: [main]
    paths: ['spikes/relay-batch/**', 'cloudflare/src/worker.js', 'cloudflare/test/relay.test.js', '.github/workflows/relay-batch-research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Candidate invariants and unchanged Worker regressions
        run: node --test spikes/relay-batch/candidate.test.mjs spikes/relay-batch/candidate.regression.test.mjs
