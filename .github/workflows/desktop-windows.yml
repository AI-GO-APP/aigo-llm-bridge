name: Desktop windows
on:
  pull_request:
    paths: ['desktop/**', 'desktop_platform/windows/**', 'packaging/build_desktop.py', 'packaging/windows/**', '.github/workflows/desktop-windows.yml', 'VERSION']
  push:
    branches: [main]
    paths: ['desktop/**', 'desktop_platform/windows/**', 'packaging/build_desktop.py', 'packaging/windows/**', '.github/workflows/desktop-windows.yml', 'VERSION']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: 共用核心與本平台回歸
        run: python -m pytest desktop/tests desktop_platform/windows/tests worker/tests -q
      - name: 原生安裝與設定煙霧測試
        env:
          AIGO_DESKTOP_HOME: ${{ runner.temp }}/aigo-desktop-smoke
        run: python desktop_platform/windows/install.py --no-start --port 18790
      - name: 建置本平台安裝包
        run: python packaging/windows/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/windows/*
