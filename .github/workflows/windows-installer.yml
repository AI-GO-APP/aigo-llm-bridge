name: Windows installer regression
on:
  pull_request:
    paths: ['desktop_bridge/**', 'cloudflare/**', 'tools/audit_dependencies.py', 'packaging/windows/**', 'tools/verify_installer_update.py', 'tools/verify_windows_onboarding.py', '.github/workflows/windows-installer*.yml']
  push:
    branches: [main]
    paths: ['desktop_bridge/**', 'cloudflare/**', 'tools/audit_dependencies.py', 'packaging/windows/**', 'tools/verify_installer_update.py', 'tools/verify_windows_onboarding.py', '.github/workflows/windows-installer*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-installer-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  machine-ownership:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.9'
      - name: Locked test runtime
        shell: pwsh
        run: |
          python -m venv .desktop-build/venv
          .desktop-build/venv/Scripts/python -m pip install --require-hashes -r packaging/windows/requirements-lock.txt
      - name: Real standard-user and TS-session ownership on disposable runner
        shell: pwsh
        run: .desktop-build/venv/Scripts/python tools/verify_windows_machine.py parent --output "$env:RUNNER_TEMP/bridge-machine-ownership"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-machine-ownership
          path: |
            ${{ runner.temp }}/bridge-machine-ownership/acceptance.json
            ${{ runner.temp }}/bridge-machine-ownership/*-failure.json
            ${{ runner.temp }}/bridge-machine-ownership/**/worker-failure.json
          if-no-files-found: warn
  isolated-update:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Locked Windows tools (no machine-global install)
        shell: pwsh
        run: |
          python -m venv .desktop-build/venv
          .desktop-build/venv/Scripts/python -m pip install --require-hashes -r packaging/windows/requirements-lock.txt
          npm.cmd ci --ignore-scripts --prefix cloudflare
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .desktop-build/venv/Scripts/python tools/audit_dependencies.py --output "$env:RUNNER_TEMP/bridge-dependency-audit.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tool install --tool-path "$env:RUNNER_TEMP/bridge-vpk" vpk --version 1.2.161
      - name: Disposable-runner WebView2 prerequisite
        shell: pwsh
        run: ./packaging/windows/ensure_ci_webview.ps1
      - name: Core, policy and relay regression
        shell: pwsh
        run: |
          .desktop-build/venv/Scripts/python -m pytest desktop_bridge/tests packaging/windows/tests -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test cloudflare/test/relay.test.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test packaging/windows/tests/platform.test.js
      - name: Real isolated Setup and A-to-B native update
        shell: pwsh
        run: .desktop-build/venv/Scripts/python tools/tests/run_native_update.py --output "$env:RUNNER_TEMP/bridge-update-proof" --vpk "$env:RUNNER_TEMP/bridge-vpk/vpk.exe"
      - name: Native AC policy and restore on disposable runner
        shell: pwsh
        run: .desktop-build/venv/Scripts/python tools/verify_windows_onboarding.py --output "$env:RUNNER_TEMP/bridge-onboarding-power"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-installer-acceptance
          path: |
            ${{ runner.temp }}/bridge-update-proof/acceptance.json
            ${{ runner.temp }}/bridge-onboarding-power/acceptance.json
          if-no-files-found: warn
