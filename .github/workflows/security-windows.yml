name: Windows dependency security
on:
  pull_request:
    paths: ['packaging/windows/**', 'cloudflare/package*.json', 'desktop_bridge/requirements.txt', 'tools/audit_dependencies.py', '.github/workflows/security-windows.yml']
  push:
    branches: [main]
    paths: ['packaging/windows/**', 'cloudflare/package*.json', 'desktop_bridge/requirements.txt', 'tools/audit_dependencies.py', '.github/workflows/security-windows.yml']
  schedule:
    - cron: '19 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.9'
      - run: python -m pip install --require-hashes -r packaging/windows/requirements-signing-lock.txt
      - run: python tools/audit_dependencies.py
