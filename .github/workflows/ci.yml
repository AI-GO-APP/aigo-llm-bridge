name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 也要檢查 commit 訊息
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 禁字檢查
        env:
          # 一定要用 secret:repository variable 會以明文印在公開的 CI 紀錄裡(步驟開頭的 env 區塊),
          # 等於把清單公告了;secret 會被遮成 ***。fork 的 PR 拿不到 secret,下面只警告不擋。
          BANNED_TERMS: ${{ secrets.BANNED_TERMS }}
        run: |
          # 本 repo 必須設定清單;fork 沒有清單時只警告、不擋
          if [ "${{ github.repository }}" = "AI-GO-APP/aigo-llm-bridge" ]; then
            python tools/lint_terms.py --commits --require
          else
            python tools/lint_terms.py --commits
          fi

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 編譯檢查所有 Python 檔
        run: python -m compileall -q tools spikes hosted worker clients examples
      - name: 範例裡的客戶端副本與 clients/ 正本一致
        run: python tools/sync_clients.py --check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝測試相依
        run: pip install -r spikes/hosted-echo/requirements.txt httpx pytest
      - name: pytest(hosted-echo)
        run: python -m pytest spikes/hosted-echo -q

  hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝相依
        run: pip install -r hosted/requirements.txt pytest
      - name: pytest(Bridge、三種客戶端、Hosted 範例)
        working-directory: hosted
        run: python -m pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 連 commit 歷史一起查
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 機敏資訊檢查(輸出不顯示命中的內容)
        run: python tools/scan_secrets.py --history

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 版本號一致(VERSION、三個常數、CHANGELOG 段落)
        run: python tools/version.py --check
      - name: 安裝 pytest(工具本身只用標準函式庫)
        run: pip install pytest
      - name: pytest(文件連結、版本工具、機敏資訊掃描)
        run: python -m pytest tools/tests -q -p no:cacheprovider

  version-bump:
    # 每次合併都要對得回一個 tag 與 Release;改了部署者或使用者拿得到的內容就必須 bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 改到發布內容就必須 bump VERSION
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD \
            | grep -vE '^(\.github/|spikes/|hosted/tests/|worker/tests/|tools/tests/)' || true)
          if [ -z "$changed" ]; then
            echo "只改了 CI、spikes 或測試,不需要發版"
            exit 0
          fi
          echo "會送到使用者端的檔案:"
          echo "$changed" | sed 's/^/  /'
          base_version=$(git show "$BASE_SHA:VERSION" | head -n1 | tr -d '\r ')
          python tools/version.py --newer-than "$base_version"

  worker:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝 pytest(worker 本身只用標準函式庫)
        run: pip install pytest
      - name: pytest(worker)
        working-directory: worker
        run: python -m pytest tests -q -p no:cacheprovider
